name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4   # v4 is latest

      - name: Set up Python
        uses: actions/setup-python@v5   # bump to v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4   # bump to v4
        with:
          name: exe-build
          path: dist/*.exe
